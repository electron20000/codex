{% extends "base.html" %}
{% block title %}Tablica STOW{% endblock %}
{% block header %}WHERE TO GO{% endblock %}
{% block content %}
<div
    class="locations-board"
    data-board
    {% if last_updated %}data-last-updated="{{ last_updated|date:'c' }}"{% endif %}
>
    {% include "dashboard/partials/location_cards.html" with locations=locations %}
</div>
{% endblock %}
{% block extra_scripts %}
<script>
    (function () {
        const boardEl = document.querySelector('[data-board]');
        if (!boardEl) {
            return;
        }
        let lastUpdated = boardEl.dataset.lastUpdated || null;
        const endpoint = "{% url 'board-data' %}";

        async function poll() {
            try {
                const response = await fetch(endpoint, {
                    headers: {"X-Requested-With": "XMLHttpRequest"},
                });
                if (!response.ok) {
                    throw new Error(`Request failed with status ${response.status}`);
                }
                const payload = await response.json();
                if (payload.last_updated && payload.last_updated !== lastUpdated) {
                    boardEl.innerHTML = payload.html;
                    boardEl.dataset.lastUpdated = payload.last_updated;
                    lastUpdated = payload.last_updated;
                }
            } catch (error) {
                console.error("Błąd podczas odświeżania tablicy:", error);
            }
        }

        poll();
        setInterval(poll, 5000);
    })();
</script>
{% endblock %}
